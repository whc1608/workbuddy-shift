[package]
name = "wb-shift-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "workbuddy-shift 核心逻辑（账号/切换/会话/签到/更新），不依赖 Tauri，可被桌面端与 HTTP server 复用"

# 共享 lint 见根 Cargo.toml 的 [workspace.lints]。
[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# system-proxy：GUI 进程没有 HTTP(S)_PROXY 环境变量时也要走系统代理，
# 否则受限网络下更新检查/下载直接失败（第三轮第 1 条）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
# semver：预发布版本比较（0.2.1-rc.1 < 0.2.1），不能再用「取数字前缀」（第三轮第 19 条）。
semver = "1"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
uuid = { workspace = true, features = ["v4"] }
dirs = "5"
chrono.workspace = true
# backup：会话同步前用 SQLite 在线备份 API 生成一致快照，不直接 cp 活动库。
rusqlite = { workspace = true, features = ["bundled", "backup"] }
# 会话关联的内容版本（归一化行摘要 / 全文摘要）。不能改用 DefaultHasher：跨进程
# 与跨版本都不稳定，无法作为持久化内容身份。
sha2 = "0.10"
# R6-06：解密出的临时凭据只在内存持有，Drop 时必须零化（key 与明文 token 都适用）。
zeroize = "1"

# CodeBuddy CN IDE Safe Storage (state.vscdb secret inject)
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Linux 密钥环：直接按 Secret Service D-Bus 协议读 Safe Storage 密码，不依赖
# 默认不安装的 secret-tool（issue #80）。版本与 tauri 依赖图里已有的那份一致，
# 不引入新的下载。
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
