name: fork-build

# 本分支自用的 Windows 打包流程（不签名、不发 Release、不 publish npm）。
# 上游 build.yml 在 fork 中未被 GitHub 注册，因此单独放一份最小可用的。
#
# 效率约定（fork 专用，不回流上游）：
# - 同一分支后一次 push 取消仍在跑的构建：一次构建约 5–12 分钟，连推几次时排队等
#   旧提交没有意义，产物只会被覆盖。
# - 只改文档 / 本 workflow 自身时不构建：这些改动进不了安装包。想单独验证 workflow
#   改动时用 `gh workflow run fork-build.yml -f ...`（或 Actions 页面手动 Dispatch）。

on:
  workflow_dispatch:
  push:
    branches: ["custom/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AGENT_COMPANION_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          rustflags: ""

      # 显式缓存 `target`：实测这是**唯一**能保住增量编译的手段。
      # 2026-11-28 曾试过只靠上面 action 自带的 rust-cache（删掉这一步），
      # `Build NSIS installer` 从 280s 涨到 405s、总时长 463s→507s，等于回归，
      # 所以恢复。key 只随 Cargo.lock 变，restore-keys 兜底命中上一版。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # bundle 目录会随 `target` 一起进 cargo 缓存：不先删，上一个版本的
      # `*-setup.exe` 会留在同一目录，被下面的 glob 一起打进 artifact——
      # 实测 0.5.2 的产物里混进过 0.5.0 的安装包。上游 build.yml 同样在构建前清理。
      - name: Clean previous bundle output
        run: Remove-Item -Recurse -Force target/x86_64-pc-windows-msvc/release/bundle -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build NSIS installer
        run: pnpm run tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
