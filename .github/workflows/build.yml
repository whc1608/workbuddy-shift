name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build. win-x64 produces a test installer without a GitHub Release."
        type: choice
        default: all
        options:
          - all
          - win-x64
          - mac-arm64
          - mac-x64
          - linux-x64
          - linux-arm64

permissions:
  contents: write

jobs:
  select-matrix:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # tag 发布前先核对版本：tag 去掉 v 后必须等于根 Cargo.toml 的 [workspace.package]
      # version 与 tauri.conf.json 的 version。不一致就直接失败，避免发出版本号对不上的包。
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -A6 '^\[workspace\.package\]' Cargo.toml | grep -m1 '^version' | sed 's/.*"\(.*\)"/\1/' | tr -d '\r')
          TAURI_VER=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' | tr -d '\r')
          echo "tag=$TAG_VER cargo=$CARGO_VER tauri=$TAURI_VER"
          if [ -z "$CARGO_VER" ] || [ -z "$TAURI_VER" ]; then
            echo "error: 无法读取 Cargo.toml / tauri.conf.json 的版本号" >&2
            exit 1
          fi
          if [ "$TAG_VER" != "$CARGO_VER" ] || [ "$TAG_VER" != "$TAURI_VER" ]; then
            echo "error: tag 版本必须等于 Cargo.toml [workspace.package] version 与 tauri.conf.json version" >&2
            exit 1
          fi

      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          all_platforms = [
              {
                  "name": "mac-arm64",
                  "os": "macos-latest",
                  "target": "aarch64-apple-darwin",
                  "cli_bin": "workbuddy-shift-darwin-arm64",
                  "platform_tag": "darwin-arm64",
                  "bundles": "app",
                  "update_os": "macos",
                  "update_arch": "aarch64",
                  "update_bundle": "macos",
                  "update_archive_name": "workbuddy-shift-macos-aarch64.app.tar.gz",
              },
              {
                  "name": "mac-x64",
                  "os": "macos-latest",
                  "target": "x86_64-apple-darwin",
                  "cli_bin": "workbuddy-shift-darwin-x64",
                  "platform_tag": "darwin-x64",
                  "bundles": "app",
                  "update_os": "macos",
                  "update_arch": "x86_64",
                  "update_bundle": "macos",
                  "update_archive_name": "workbuddy-shift-macos-x86_64.app.tar.gz",
              },
              {
                  "name": "win-x64",
                  "os": "windows-latest",
                  "target": "x86_64-pc-windows-msvc",
                  "cli_bin": "workbuddy-shift-win32-x64.exe",
                  "platform_tag": "win32-x64",
                  "bundles": "nsis",
                  "update_os": "windows",
                  "update_arch": "x86_64",
                  "update_bundle": "nsis",
                  # 第 18 条：Windows 只保留带版本号的人用安装包名，updater 清单直接引用它，
                  # 不再额外复制一份 workbuddy-shift-windows-x86_64-setup.exe。
                  "update_archive_name": "",
              },
              {
                  "name": "linux-x64",
                  "os": "ubuntu-latest",
                  "target": "x86_64-unknown-linux-gnu",
                  "cli_bin": "workbuddy-shift-linux-x64",
                  "platform_tag": "linux-x64",
                  "bundles": "deb,appimage",
                  "update_os": "linux",
                  "update_arch": "x86_64",
                  "update_bundle": "appimage",
                  "update_archive_name": "workbuddy-shift-linux-x86_64.AppImage",
              },
          ]
          event = os.environ.get("EVENT_NAME", "")
          platform = (os.environ.get("PLATFORM") or "all").strip()
          if event != "workflow_dispatch" or platform in ("", "all"):
              selected = all_platforms
          elif platform == "linux-arm64":
              # 只跑 npm CLI 的 arm64 job（见 npm-linux-arm64）；build 矩阵由 job-level if 跳过。
              # 这里仍返回完整矩阵，避免 fromJSON 得到空 include 导致工作流报错。
              selected = all_platforms
          else:
              selected = [p for p in all_platforms if p["name"] == platform]
              if not selected:
                  raise SystemExit(f"unknown platform: {platform}")
          matrix = json.dumps({"include": selected})
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("matrix<<EOF\n")
              f.write(matrix + "\n")
              f.write("EOF\n")
          PY

  build:
    name: ${{ matrix.name }}
    needs: select-matrix
    # 手动只验证 linux-arm64 CLI 时跳过桌面矩阵（select-matrix 仍返回完整矩阵，
    # 避免空 include 让工作流报错）。
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux-arm64'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # 该 action 默认给 RUSTFLAGS 加 -D warnings，会把内置会话悬浮窗组件
          # （crates/companion-*）在 linux cfg 下的 dead_code 告警升级成错误。发版构建
          # 不需要这层门禁（自有代码的告警由 test.yml 的 lint job 把关）。
          rustflags: ""

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # dmgbuild writes Finder metadata without opening Finder, so DMGs keep
      # their large icons and drag arrow in headless macOS runners.
      - name: Set up Python for dmgbuild
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dmgbuild (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMGBUILD_VENV="$RUNNER_TEMP/dmgbuild-venv"
          python3 -m venv "$DMGBUILD_VENV"
          "$DMGBUILD_VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            "dmgbuild==1.6.7"
          echo "$DMGBUILD_VENV/bin" >> "$GITHUB_PATH"

      # 前端构建产物（CLI 二进制 rust-embed 嵌入 + Tauri App 使用）
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # CLI 二进制
      - name: Build server binary
        shell: bash
        run: |
          cargo build -p wb-shift-server --release --target ${{ matrix.target }}
          mkdir -p dist-bin

      # 打包本平台包并发布到 npm（CLI 二进制走 npm registry，Release 只留桌面 App）
      # 仅 tag 发布；手动触发（例如只打 Windows 试装包）不得 npm publish。
      # 仓库变量 PUBLISH_NPM=false 时整段跳过：registry 维护/故障期间仍可把桌面 App 发出去，
      # 恢复后把变量改回 true 重跑本工作流即可补发 npm（脚本幂等，Release 资产会覆盖）。
      - name: Publish platform package
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM != 'false'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_DIR="npm/platform/workbuddy-shift-${{ matrix.platform_tag }}"
          # 用 tag 版本同步 platform 包版本（git 里的可能滞后）
          VER="${GITHUB_REF_NAME#v}"
          perl -pi -e "s/\"version\": \"[0-9.]+\"/\"version\": \"$VER\"/" "$PKG_DIR/package.json"
          mkdir -p "$PKG_DIR/bin"
          SRC="target/${{ matrix.target }}/release/workbuddy-shift"
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          cp "$SRC" "$PKG_DIR/bin/${{ matrix.cli_bin }}"
          cd "$PKG_DIR"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          case "$GITHUB_REF_NAME" in *-*) NPM_TAG="--tag next" ;; *) NPM_TAG="" ;; esac
          npm publish $NPM_TAG --access public --registry=https://registry.npmjs.org

      # 桌面 App（mac app / nsis exe / deb + AppImage）
      # 仓库变量 PUBLISH_APP=false 时整段跳过：纯 npm/CLI 改动可只发 npm 不发桌面 App；
      # 恢复为 true 后重跑本工作流即可幂等补发（与 PUBLISH_NPM 对称）。
      - name: Build desktop app
        if: vars.PUBLISH_APP != 'false'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AGENT_COMPANION_TARGET: ${{ matrix.target }}
        run: |
          # 版本单一来源：根 Cargo.toml 的 [workspace.package] version
          # （src-tauri/Cargo.toml 已改为 version.workspace = true，不再单独写版本）。
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep -A6 '^\[workspace\.package\]' Cargo.toml | grep -m1 '^version' | sed 's/.*"\(.*\)"/\1/' | tr -d '\r')
          fi
          if [ -z "$VER" ]; then
            echo "error: 无法确定版本号（tag 与 Cargo.toml [workspace.package] version 均未取到）" >&2
            exit 1
          fi
          echo "build version: $VER"
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          # cargo cache 会保留旧 NSIS/DMG/AppImage；不清理就会把 0.1.17 一类产物带进 Release。
          rm -rf "$BUNDLE_ROOT"
          pnpm run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          echo "bundle after build:"
          find "$BUNDLE_ROOT" -type f | sort || true
          # Tauri 2 的产物名由 productName（"WorkBuddy Shift"，含空格）决定：
          #   macOS → <productName>.app；Windows NSIS → <productName>_<version>_<arch>-setup.exe。
          # 一律用 find 取真实路径，再按 Release/README 约定改成 workbuddy-shift_* 资产名。
          if [ "${{ matrix.bundles }}" = "nsis" ]; then
            SETUP_MATCHES=$(find "$BUNDLE_ROOT/nsis" -maxdepth 1 -type f -name '*-setup.exe')
            SETUP_COUNT=$(printf '%s\n' "$SETUP_MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$SETUP_COUNT" != 1 ]; then
              echo "error: expected exactly 1 NSIS installer, found $SETUP_COUNT" >&2
              printf '%s\n' "$SETUP_MATCHES" >&2
              find "$BUNDLE_ROOT" -type f | sort >&2 || true
              exit 1
            fi
            # 数量对但版本可能被 cargo cache 带成旧的：文件名必须含 _<tag 版本>_。
            case "$SETUP_MATCHES" in
              *"_${VER}_"*-setup.exe) ;;
              *)
                echo "error: installer version mismatch, expected ${VER}: $SETUP_MATCHES" >&2
                exit 1
                ;;
            esac
            cp "$SETUP_MATCHES" "dist-bin/workbuddy-shift_${VER}_x64-setup.exe"
            if [ -f "$SETUP_MATCHES.sig" ]; then
              cp "$SETUP_MATCHES.sig" "dist-bin/workbuddy-shift_${VER}_x64-setup.exe.sig"
            fi
          fi
          # updater 用的签名副本由下一步按 UPDATE_ARCHIVE_NAME 生成；这里只放用户直接下载的安装包。
          # Linux 的 deb/AppImage 由下方 updater 步骤按统一资产名复制，
          # 这里只收 macOS/Windows 的用户下载包，避免 Release 出现两份同名产物。
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.dmg' -o -name '*.msi' \) \
            -exec cp {} dist-bin/ \;
          # mac：纯命令行打 dmg（CI 无 Finder，Tauri 自带的 bundle_dmg.sh 会失败）
          if [ "${{ matrix.bundles }}" = "app" ]; then
            APP_MATCHES=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name '*.app')
            APP_COUNT=$(printf '%s\n' "$APP_MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$APP_COUNT" != 1 ]; then
              echo "error: expected exactly 1 .app bundle, found $APP_COUNT" >&2
              printf '%s\n' "$APP_MATCHES" >&2
              exit 1
            fi
            sh scripts/make-dmg.sh "$VER" "${{ matrix.update_arch }}" "$APP_MATCHES"
            cp "workbuddy-shift_${VER}_${{ matrix.update_arch }}.dmg" dist-bin/
          fi

      - name: Generate updater manifest
        if: matrix.update_arch != '' && vars.PUBLISH_APP != 'false'
        shell: bash
        env:
          UPDATE_OS: ${{ matrix.update_os }}
          UPDATE_ARCH: ${{ matrix.update_arch }}
          UPDATE_ARCHIVE_NAME: ${{ matrix.update_archive_name }}
          BUNDLE_DIR: target/${{ matrix.target }}/release/bundle/${{ matrix.update_bundle }}
        run: |
          # 版本单一来源：根 Cargo.toml 的 [workspace.package] version
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep -A6 '^\[workspace\.package\]' Cargo.toml | grep -m1 '^version' | sed 's/.*"\(.*\)"/\1/' | tr -d '\r')
          fi
          if [ -z "$VER" ]; then
            echo "error: 无法确定版本号（tag 与 Cargo.toml [workspace.package] version 均未取到）" >&2
            exit 1
          fi
          echo "updater bundle dir: $BUNDLE_DIR (version $VER)"
          ls -la "$BUNDLE_DIR" || true
          if [ "$UPDATE_OS" = "linux" ]; then
            # linux 有 deb / AppImage 两种安装形态：各自收集归档与签名，再生成两份 manifest。
            # 本分支自行完成全部产物收集，不走下方 macOS/Windows 的公共尾部。
            LINUX_ROOT="$(dirname "$BUNDLE_DIR")"
            APPIMAGE="$(find "$LINUX_ROOT/appimage" -maxdepth 1 -type f -name '*.AppImage' | sort)"
            DEB="$(find "$LINUX_ROOT/deb" -maxdepth 1 -type f -name '*.deb' | sort)"
            APPIMAGE_COUNT=$(printf '%s\n' "$APPIMAGE" | sed '/^$/d' | wc -l | tr -d ' ')
            DEB_COUNT=$(printf '%s\n' "$DEB" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$APPIMAGE_COUNT" != 1 ] || [ "$DEB_COUNT" != 1 ]; then
              echo "error: expected exactly 1 .AppImage and 1 .deb, found $APPIMAGE_COUNT / $DEB_COUNT" >&2
              printf 'appimage: %s\ndeb: %s\n' "$APPIMAGE" "$DEB" >&2
              exit 1
            fi
            if [ ! -f "$APPIMAGE.sig" ] || [ ! -f "$DEB.sig" ]; then
              echo "error: missing signature for $APPIMAGE or $DEB" >&2
              exit 1
            fi
            cp "$APPIMAGE" "dist-bin/workbuddy-shift-linux-${UPDATE_ARCH}.AppImage"
            cp "$APPIMAGE.sig" "dist-bin/workbuddy-shift-linux-${UPDATE_ARCH}.AppImage.sig"
            cp "$DEB" "dist-bin/workbuddy-shift-linux-${UPDATE_ARCH}.deb"
            cp "$DEB.sig" "dist-bin/workbuddy-shift-linux-${UPDATE_ARCH}.deb.sig"
            UPDATE_VERSION="$VER" UPDATE_OS=linux UPDATE_ARCH="$UPDATE_ARCH" UPDATE_BUNDLE=appimage \
              UPDATE_KEYS="linux-${UPDATE_ARCH}-appimage linux-${UPDATE_ARCH}" \
              UPDATE_ARCHIVE_NAME="workbuddy-shift-linux-${UPDATE_ARCH}.AppImage" \
              UPDATE_JSON_NAME="latest-linux-${UPDATE_ARCH}.json" \
              BUNDLE_DIR="$LINUX_ROOT/appimage" sh scripts/gen-update-json.sh
            UPDATE_VERSION="$VER" UPDATE_OS=linux UPDATE_ARCH="$UPDATE_ARCH" UPDATE_BUNDLE=deb \
              UPDATE_KEYS="linux-${UPDATE_ARCH}-deb" \
              UPDATE_ARCHIVE_NAME="workbuddy-shift-linux-${UPDATE_ARCH}.deb" \
              UPDATE_JSON_NAME="latest-linux-deb-${UPDATE_ARCH}.json" \
              BUNDLE_DIR="$LINUX_ROOT/deb" sh scripts/gen-update-json.sh
            cp "$LINUX_ROOT/appimage/latest-linux-${UPDATE_ARCH}.json" dist-bin/
            cp "$LINUX_ROOT/deb/latest-linux-deb-${UPDATE_ARCH}.json" dist-bin/
            exit 0
          fi
          if [ "$UPDATE_OS" = "windows" ]; then
            # 第 18 条：清单直接引用带版本号的人用安装包，Release 不再出现同 sha 的第二份。
            UPDATE_ARCHIVE_NAME="workbuddy-shift_${VER}_x64-setup.exe"
            # NSIS 真实文件名是 <productName>_<version>_x64-setup.exe（productName 含空格），
            # 用 glob 取真实文件并校验数量与版本，避免签名对到旧安装包。
            ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*-setup.exe' | sort)"
            COUNT=$(printf '%s\n' "$ARCHIVE" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$COUNT" != 1 ]; then
              echo "error: expected exactly 1 *-setup.exe, found $COUNT" >&2
              printf '%s\n' "$ARCHIVE" >&2
              exit 1
            fi
            case "$ARCHIVE" in
              *"_${VER}_"*-setup.exe) ;;
              *)
                echo "error: installer version mismatch, expected ${VER}: $ARCHIVE" >&2
                exit 1
                ;;
            esac
          else
            ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' | sort)"
            COUNT=$(printf '%s\n' "$ARCHIVE" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$COUNT" != 1 ]; then
              echo "error: expected exactly 1 .app.tar.gz, found $COUNT" >&2
              printf '%s\n' "$ARCHIVE" >&2
              exit 1
            fi
          fi
          if [ ! -f "$ARCHIVE" ]; then
            echo "error: missing updater archive ($ARCHIVE)" >&2
            exit 1
          fi
          if [ -f "$ARCHIVE.sig" ]; then
            if [ "$(basename "$ARCHIVE")" = "$UPDATE_ARCHIVE_NAME" ] && [ -f "dist-bin/$UPDATE_ARCHIVE_NAME" ]; then
              echo "updater 资产已由用户安装包步骤就位：$UPDATE_ARCHIVE_NAME"
            else
              cp "$ARCHIVE" "dist-bin/$UPDATE_ARCHIVE_NAME"
            fi
            cp "$ARCHIVE.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
            UPDATE_VERSION="$VER" sh scripts/gen-update-json.sh
            MANIFEST="$BUNDLE_DIR/latest-${UPDATE_OS}-${UPDATE_ARCH}.json"
            test -f "$MANIFEST"
            cp "$MANIFEST" dist-bin/
          else
            echo "unsigned fork build: skip updater manifest ($ARCHIVE)"
          fi

      - uses: actions/upload-artifact@v4
        if: vars.PUBLISH_APP != 'false'
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  # npm / webui 的 linux-arm64 CLI：只发布平台包，不产出桌面安装包。
  #
  # 为什么与 build 矩阵分开：新增的 ARM64 目标不应该把四平台桌面发布 / GitHub Release
  # 一起拖垮；但 publish-main 仍依赖它，保证主包不会引用尚未发布的平台包。
  # 用 GitHub 公共仓库的 arm64 runner 原生编译，避免交叉编译 rusqlite bundled / zbus。
  npm-linux-arm64:
    name: npm CLI (linux-arm64)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-arm64'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # 与 build 矩阵一致：发版构建不把上游组件的告警升级成错误。
          rustflags: ""

      # 缓存键带 arch：x64 / arm64 的 runner.os 都是 Linux，共用键会恢复错架构的 target。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-cli-

      # server 二进制用 rust-embed 嵌入 dist/，先构建前端。
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build server binary
        run: cargo build -p wb-shift-server --release --locked

      # 防止 runner 标签变更时静默产出 x64 二进制、再用 linux-arm64 的名义发布。
      - name: Verify binary architecture
        run: |
          test "$(uname -m)" = "aarch64"
          file target/release/workbuddy-shift | grep -q "ARM aarch64"

      # 与 build 矩阵的平台包发布同构：tag 版本同步、复制二进制、npm publish。
      - name: Publish platform package
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM != 'false'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_DIR="npm/platform/workbuddy-shift-linux-arm64"
          VER="${GITHUB_REF_NAME#v}"
          perl -pi -e "s/\"version\": \"[0-9.]+\"/\"version\": \"$VER\"/" "$PKG_DIR/package.json"
          mkdir -p "$PKG_DIR/bin"
          cp "target/release/workbuddy-shift" "$PKG_DIR/bin/workbuddy-shift-linux-arm64"
          cd "$PKG_DIR"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          case "$GITHUB_REF_NAME" in *-*) NPM_TAG="--tag next" ;; *) NPM_TAG="" ;; esac
          npm publish $NPM_TAG --access public --registry=https://registry.npmjs.org

  # 所有平台包发布成功后，发布主包（optionalDependencies 引用平台包）
  publish-main:
    name: Publish npm main package
    needs: [build, npm-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          case "$GITHUB_REF_NAME" in *-*) NPM_TAG="--tag next" ;; *) NPM_TAG="" ;; esac
          npm publish $NPM_TAG --access public --registry=https://registry.npmjs.org

  # GitHub Packages 的 npm scoped 镜像（备用渠道）。
  #
  # 与 npmjs 主渠道并行：主渠道还是上面两个 job 发的 workbuddy-shift + 5 个平台包；
  # 这里额外把同一版本重打包成 @<owner>/workbuddy-shift* 发到 npm.pkg.github.com，
  # 让包出现在仓库的「Packages」页。GitHub Packages 只接受 scoped 包名，且安装即使
  # 公开包也要 token，所以它只是兜底渠道。
  #
  # needs 必须带上 publish-main：脚本第一步就是 `npm pack workbuddy-shift@<ver>`
  # 从 npmjs 拉主包 tarball。publish-main 的 needs 与本 job 相同（会和本 job 并行），
  # 不显式依赖的话主包可能还没发出来 → E404 → 整个 build workflow 变红
  # （release 只 needs build，资产照样发出去，红了反而掩盖真实状态）。
  # 两个 job 的 if 完全一致（tag + PUBLISH_NPM != 'false'），PUBLISH_NPM=false 时一起跳过。
  #
  # permissions 是 job 级覆盖（workflow 级的 contents: write 不受影响）：
  # GITHUB_TOKEN 的 packages: write 足够把包写进本仓库。
  publish-github-packages:
    name: Mirror npm packages to GitHub Packages
    needs: [build, npm-linux-arm64, publish-main]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish scoped mirror packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh scripts/publish-github-packages.sh \
            "${GITHUB_REF_NAME#v}" "${{ github.repository_owner }}" "${{ github.repository }}"

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_APP != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 draft / 上传资产 / 转正
      actions: write    # 派发 release-smoke（原因见下方 Dispatch 步骤的注释）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge updater manifests
        env:
          # 缺平台是静默故障（Linux 曾因此 18 个版本收不到更新），合并后强制校验键齐全
          REQUIRED_PLATFORMS: darwin-aarch64,darwin-x86_64,windows-x86_64-nsis,windows-x86_64,linux-x86_64,linux-x86_64-deb,linux-x86_64-appimage
        run: python3 scripts/merge-update-manifests.py artifacts

      # 第 4 条 A：先建 draft 并上传全部资产，最后一步才切 latest。
      # 上传中断时 release 保持 draft，/releases/latest 仍指向上一个完整版本。
      - name: Compose release body
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BODY="release-body.md"
          : > "$BODY"
          NOTES_FILE="docs/release-notes-v${VER}.md"
          [ -f "$NOTES_FILE" ] || NOTES_FILE="delivery/release-notes-v${VER}.md"
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" >> "$BODY"
            echo "" >> "$BODY"
            echo "" >> "$BODY"
          fi
          # 资源说明独立成文件，避免 heredoc 缩进把 Markdown 变成代码块。
          if grep -q "下载哪个？" "$BODY"; then
            echo "发行说明已含资源说明，跳过自动追加"
          else
            sed "s/<ver>/${VER}/g" docs/release-assets.md >> "$BODY"
          fi
          echo "::group::release body"
          cat "$BODY"
          echo "::endgroup::"

      - name: Upload to GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          body_path: release-body.md
          generate_release_notes: false

      - name: Publish release (atomic latest switch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 资产全部上传成功后才把 draft 转正。
          # 正式版（tag 不含 `-`）才设为 latest；预览版标 prerelease，
          # 这样 /releases/latest 与自动更新不会把预览版推给所有用户。
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-release-assets.py "$GITHUB_REF_NAME"

      # docker.yml 由同一个 tag **并行**触发，镜像通常比本 job 晚 10–25 分钟才推上去。
      # 不等就派发验收，docker 形态会拿到 C（pull 失败）并白烧一次 C 类处置（v0.2.6 实测踩到：
      # Release 20:54 转正、验收 20:57 开跑，镜像还在构建，docker 全红并开了 issue）。
      - name: Wait for container image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          # 窗口必须容得下 docker.yml 的真实耗时：v0.3.0 用了 61 分钟、v0.3.1 用了 55 分钟
          # （多架构 buildx + 缓存冷启动），而旧窗口只有 20 分钟 —— 于是每一次发版都会先
          # 超时、再派发一次注定 docker 记 C 的验收（v0.3.1 就这样开了 issue #6）。
          # 225 × 20s = 75 分钟；同时盯 docker.yml 的状态，它已经结束且没有镜像时不必空等。
          MAX=225
          for i in $(seq 1 $MAX); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "镜像已就绪：$IMAGE（等待 $((i * 20 - 20))s）"
              exit 0
            fi
            STATE=$(gh run list --workflow=docker.yml --limit 1 \
              --json headBranch,status,conclusion \
              -q ".[] | select(.headBranch == \"$TAG\") | \"\(.status) \(.conclusion)\"" 2>/dev/null | head -1 || true)
            case "$STATE" in
              "completed success")
                # workflow 绿了但 manifest 还不可见：多给两轮让 registry 传播，再放弃。
                ;;
              "completed "*)
                echo "::warning::docker.yml 已结束（${STATE}）但 $IMAGE 仍不可见，提前派发验收"
                exit 0
                ;;
            esac
            echo "等待镜像（$i/$MAX，已 $((i * 20 - 20))s，docker.yml: ${STATE:-未找到}）：$IMAGE"
            sleep 20
          done
          echo "::warning::等待 75 分钟仍未看到 $IMAGE，仍会派发验收（docker 形态将记 C）"

      # 必须显式派发：GitHub 的防递归规则下，用 GITHUB_TOKEN 造成的 release:published
      # **不会**触发新的 workflow run（只有人工/第三方发布才会）。v0.2.6 首次发版即踩到：
      # Release 正常转正，但 release-smoke 一条都没跑。
      #
      # 预览版（tag 含 `-`）**不派发**：release-smoke 的 preflight 按 PRD P0-1 只验正式版，
      # `release.prerelease` / `tag.prerelease` 两条是 error，派发了只会得到一次必红的 run
      # （5 个验收 job 全 skipped，triage 也因 `ok != true` 不做任何处置）。
      # 判定口径与上面的 npm dist-tag、下面的 Release 转正保持一致。
      - name: Dispatch release-smoke
        if: ${{ !contains(github.ref, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-smoke.yml -f tag="$GITHUB_REF_NAME" -f dry_run=false
          echo "已派发 release-smoke：$GITHUB_REF_NAME"
